# PatchLoop: mongo + agent (internal only) + backend + frontend.
#
#   export AGENT_SHARED_SECRET=$(openssl rand -hex 32)   # shared by agent and backend
#   cp agent/.env.example agent/.env; cp backend/.env.example backend/.env   # then fill in
#   docker compose up --build
#
# Per-service settings come from agent/.env and backend/.env (optional files). The values set
# under `environment:` below win over them (service URLs inside the compose network, the secret).
# The agent publishes no port: only the backend reaches it, over the compose network.
name: patchloop

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  agent:
    build: ./agent
    env_file:
      - path: ./agent/.env
        required: false
    environment:
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:?set AGENT_SHARED_SECRET (same value for agent and backend)}
      BACKEND_CALLBACK_URL: http://backend:8080
      PORT: "8001"
    expose:
      - "8001"
    volumes:
      - agent-runs:/srv/agent/runs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:?set AGENT_SHARED_SECRET (same value for agent and backend)}
      AGENT_URL: http://agent:8001
      MONGO_URI: mongodb://mongo:27017
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set the Clerk publishable key}
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set the Clerk secret key}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
  agent-runs:
